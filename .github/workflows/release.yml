# Builds the release zips, attaches them to a GitHub release, and uploads the store zip to the Chrome Web Store (store job).
# - Pushing a tag `v<version>` (matching package.json and the manifest) runs every check, the headless e2e suites,
#   builds the zips with `npm run release`, and attaches them to that tag's release. A release that doesn't
#   exist yet is created as a draft with generated notes; one that does (a draft written by hand) gets its
#   zips replaced. Publishing the draft stays a person's step.
# - Running it by hand (Actions → release → Run workflow) does the same checks and build and keeps the zips
#   as a workflow artifact, without touching any release.
# - Every push to main does the same checks and build and puts the zips on the `main-latest` pre-release (latest job),
#   replacing the previous ones: the store release of main's current commit, to load unpacked with the store's
#   extension ID. It never reaches the store (the store job runs for `v*` tags only) and never becomes the
#   repository's Latest release.
name: release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:replay
      - run: npx playwright test e2e/phase0.spec.ts e2e/phase1.spec.ts e2e/signin.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results/

  build:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install ruff==0.16.10
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      # typecheck, lint, unit and fingerprint tests, build, key scrub; then the distribution build, verified
      # (no dev code, manifest version and permissions, a clean tree) and zipped into bundles/
      - run: npm run release
      - name: Checksums
        run: cd bundles && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: onlyread-bundles
          path: bundles/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bundles/*.zip bundles/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" bundles/*.zip bundles/SHA256SUMS.txt --draft --verify-tag \
              --title "OnlyRead ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  latest:
    # main's build on one rolling pre-release, under version-less names so its download links never change:
    #   https://github.com/onlyreadai/onlyread/releases/download/main-latest/onlyread-latest.zip          (load unpacked)
    #   https://github.com/onlyreadai/onlyread/releases/download/main-latest/onlyread-latest-webstore.zip (the store zip)
    # The load-unpacked zip carries the store's public `key` back (the manifest's, which bundle.py drops when staging), so
    # it installs with the store's extension ID, foajfkjhcigaillohhdbfadobkhpddij; the webstore zip is left exactly as
    # built. Being the same ID, it can't be loaded next to the store install or the working copy.
    # The release is recreated on the new commit each time (its tag moves with it), so for a few seconds it is missing.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: extension/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: onlyread-bundles
          path: bundles
      - name: Give the load-unpacked zip the store's key
        run: |
          key=$(jq -r '.key // empty' extension/manifest.json)
          test -n "$key" || { echo "::error::extension/manifest.json has no key"; exit 1; }
          id=$(echo "$key" | base64 -d | sha256sum | head -c 32 | tr 0-9a-f a-p)
          test "$id" = foajfkjhcigaillohhdbfadobkhpddij || { echo "::error::the manifest's key gives $id, not the store's ID"; exit 1; }
          zip=$(ls bundles/onlyread-[0-9]*.zip | grep -v webstore)
          work=$(mktemp -d)
          unzip -q "$zip" -d "$work"
          jq --arg key "$key" '. + {key: $key}' "$work/onlyread/manifest.json" > "$work/manifest.json"
          mv "$work/manifest.json" "$work/onlyread/manifest.json"
          rm "$zip" && (cd "$work" && zip -qrXD - onlyread) > "$zip"
          echo "load-unpacked zip: extension ID $id"
      - name: Replace the main-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd bundles
          mv onlyread-*-webstore.zip onlyread-latest-webstore.zip
          mv onlyread-[0-9]*.zip onlyread-latest.zip
          sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
          version=$(unzip -p onlyread-latest-webstore.zip manifest.json | jq -r .version)
          gh release delete main-latest --cleanup-tag --yes || true
          gh release create main-latest onlyread-latest.zip onlyread-latest-webstore.zip SHA256SUMS.txt \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "main (unreleased, ${GITHUB_SHA::7})" \
            --notes "The store release of main at ${GITHUB_SHA} (version ${version}), built and checked exactly as a \`v*\` release is. It is not on the Chrome Web Store; use the [latest release](https://github.com/${GH_REPO}/releases/latest) for that.

          To load it: unzip \`onlyread-latest.zip\`, then on chrome://extensions turn on Developer mode, Load unpacked, and choose the \`onlyread\` folder. It has the store's extension ID, so remove the store install first. To update: unzip the new one over it and press reload on the extension's card.

          \`onlyread-latest-webstore.zip\` is the store zip itself, unchanged; \`onlyread-latest.zip\` is the same files with the store's public key in the manifest, which gives it the store's ID."

  store:
    # A release tag's store zip goes up to the Chrome Web Store as the item's new draft, and stops there: submitting it
    # for review stays a person's step, in the developer dashboard. The key lives in the `chrome-web-store` environment,
    # which only `v*` tags may use (and, once the repository is public, only after its required reviewer approves).
    # Pull requests never get it: no secret reaches a workflow run for a fork's pull request.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: onlyread-bundles
          path: bundles
      - name: Upload to the Chrome Web Store (no submission)
        env:
          KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          ITEM: foajfkjhcigaillohhdbfadobkhpddij
        run: |
          # The service account's key signs a request for a ten-minute token for the store's API only (Google's OAuth
          # JWT exchange): no other Google API, role or third-party action is involved, and the token is masked.
          TOKEN=$(node -e '
            const crypto = require("node:crypto");
            const k = JSON.parse(process.env.KEY);
            const now = Math.floor(Date.now() / 1000);
            const part = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const unsigned = `${part({ alg: "RS256", typ: "JWT" })}.${part({ iss: k.client_email, scope: "https://www.googleapis.com/auth/chromewebstore", aud: k.token_uri, iat: now, exp: now + 600 })}`;
            const jwt = `${unsigned}.${crypto.sign("RSA-SHA256", Buffer.from(unsigned), k.private_key).toString("base64url")}`;
            fetch(k.token_uri, { method: "POST", body: new URLSearchParams({ grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: jwt }) })
              .then((r) => r.json())
              .then((j) => { if (!j.access_token) { console.error(j.error_description ?? j.error ?? "no token"); process.exit(1); } process.stdout.write(j.access_token); });
          ')
          echo "::add-mask::$TOKEN"
          zip="bundles/onlyread-${GITHUB_REF_NAME#v}-webstore.zip"
          test -f "$zip" || { echo "::error::$zip is missing"; exit 1; }
          test -n "$PUBLISHER" || { echo "::error::set the repository variable CWS_PUBLISHER_ID"; exit 1; }
          api="https://chromewebstore.googleapis.com"
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -T "$zip" \
            "$api/upload/v2/publishers/$PUBLISHER/items/$ITEM:upload" > upload.json
          jq '{uploadState, crxVersion}' upload.json
          state=$(jq -r '.uploadState' upload.json)
          # A large package is processed after the upload answers: its state is asked for until it settles.
          for i in $(seq 1 40); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 15
            curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
              "$api/v2/publishers/$PUBLISHER/items/$ITEM:fetchStatus" > status.json
            state=$(jq -r '.lastAsyncUploadState' status.json)
            echo "upload: $state"
          done
          [ "$state" = "SUCCEEDED" ] || { echo "::error::the store did not take the upload ($state)"; exit 1; }
          echo "::notice::OnlyRead ${GITHUB_REF_NAME#v} is uploaded to the Chrome Web Store as a draft. Submit it for review in the developer dashboard."
