# The contributor license agreement (CLA.md): on a contributor's first pull request the bot asks them to sign
# by replying with a fixed sentence, and records the signature in signatures/cla.json on the cla-signatures
# branch. Maintainers and bots are allowed without signing.
#
# Safe only because it never runs pull request code: pull_request_target runs on main with a write-capable token.
# Never add a checkout step. The action (archived upstream in March 2026) is pinned by commit, so its code can't change.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    # This repository only: a fork has no signatures branch to write to, and the check would fail there.
    if: github.repository == 'onlyreadai/onlyread'
    runs-on: ubuntu-latest
    steps:
      # The action trims and lowercases a comment before matching it, so this gate does too: a sentence sent with a
      # trailing newline (as some browsers and editors add) still signs. contains() ignores case.
      - if: github.event_name == 'pull_request_target' || startsWith(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/onlyreadai/onlyread/blob/main/CLA.md
          branch: cla-signatures
          allowlist: aviyam181199,Hedingber,dependabot[bot],github-actions[bot]
          # The default locks every closed pull request, merged or not, signed or not, ending all discussion on it.
          lock-pullrequest-aftermerge: false
